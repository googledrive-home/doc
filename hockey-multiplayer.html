<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hockey Online — Multiplayer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#07152b;color:#f7fbff}*{box-sizing:border-box}body{margin:0;padding:20px;max-width:980px;margin:auto}h1{margin:.3em 0;color:#38d9ff}p{color:#a9bdd6}.panel{background:#102544;border:1px solid #2d4f7b;border-radius:16px;padding:16px;margin:14px 0}label{display:block;margin:10px 0 5px}input,select,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #41628d;background:#07152b;color:white;width:100%}button{background:#087ea4;border:0;font-weight:700;margin-top:10px;cursor:pointer}button.secondary{background:#234166}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}canvas{width:100%;background:#087b62;border-radius:12px;display:block}.touch-controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.touch-controls button{touch-action:none;padding:14px 3px}.status{padding:10px;background:#07152b;border-radius:8px;overflow-wrap:anywhere}.small{font-size:.9rem;color:#a9bdd6}
</style>
</head>
<body>
<h1>🏒 Hockey Online</h1><p>Online multiplayer for Hockey. Create a private room or find a public match, then play with friends on other devices.</p>
<section class="panel">
<label for="server">Render server URL</label><input id="server" value="https://hockey-multiplayer.onrender.com" placeholder="https://your-service.onrender.com" autocomplete="url">
<div class="grid"><div><label for="player">Player name</label><input id="player" maxlength="18" value="Player"></div><div><label for="mode">Match type</label><select id="mode"><option value="1v1">1 v 1</option><option value="2v2">2 v 2</option><option value="3v3">3 v 3</option><option value="2v2-ai">2 v 2 with AI fill</option></select></div><div><label for="map">Rink</label><select id="map"><option>Classic</option><option>Neon</option><option>Winter</option></select></div></div>
<div class="grid"><button id="create">Create private lobby</button><button id="public" class="secondary">Find public match</button></div>
<label for="code">Private room code</label><input id="code" maxlength="6" placeholder="e.g. A1B2C3" autocapitalize="characters"><button id="join" class="secondary">Join with code</button>
<div id="status" class="status" role="status">Not connected. Enter your Render URL first.</div>
</section>
<section class="panel"><h2>Live room preview</h2><canvas id="rink" width="900" height="600"></canvas><p class="small">Desktop: WASD / arrow keys move, Space shoots. Mobile: hold a direction button, then tap shoot.</p><div class="touch-controls"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button><button id="shoot" class="secondary">SHOOT</button></div></section>
<script type="module">
import { Client } from "https://esm.sh/colyseus.js@0.16.22";
const $=id=>document.getElementById(id);let client=null,room=null,players={},puck={x:450,y:240},dir={x:1,y:0},keys={};
function say(s){$("status").textContent=s}
function getClient(){let raw=$("server").value.trim().replace(/\/$/,"");if(!raw)throw Error("Enter your Render service URL first.");let ws=raw.replace(/^https:/,"wss:").replace(/^http:/,"ws:");client=new Client(ws);return client}
async function connect(kind){try{if(room)room.leave();const c=getClient(),options={name:$("player").value.trim()||"Player",mode:$("mode").value,map:$("map").value};say("Connecting…");if(kind==="create"){room=await c.create("hockey",{...options,private:true});$("code").value=room.state?.code||"";say("Private lobby created. Share the room code shown here.");}else if(kind==="join"){const code=$("code").value.trim().toUpperCase();if(!code)throw Error("Enter a room code.");const raw=$("server").value.trim().replace(/\/$/,"");const resp=await fetch(raw+"/room/"+encodeURIComponent(code));if(!resp.ok)throw Error("That room code was not found. Check it and try again.");const data=await resp.json();room=await c.joinById(data.roomId,options);say("Joined private lobby "+code+".");}else{room=await c.joinOrCreate("hockey_public",options);say("Joined public match.");}
room.onStateChange(state=>{players={};state.players.forEach((p,id)=>players[id]={name:p.name,team:p.team,x:p.x,y:p.y,skin:p.skin,trail:p.trail});puck={x:state.puck.x,y:state.puck.y,score1:state.puck.score1,score2:state.puck.score2};draw();});
room.onMessage("lobby",m=>say("Room "+m.code+" · "+m.players+"/"+m.capacity+" players · "+m.mode));
room.onLeave(code=>say("Disconnected from room ("+code+")."));room.onError((code,msg)=>say("Room error "+code+": "+msg));say("Connected! Room ID "+room.roomId);
}catch(e){say("Connection failed: "+(e?.message||e));}}
$("create").onclick=()=>connect("create");$("public").onclick=()=>connect("public");$("join").onclick=()=>connect("join");
function draw(){const c=$("rink"),x=c.getContext("2d");x.clearRect(0,0,900,600);x.fillStyle="#087b62";x.fillRect(0,0,900,600);x.strokeStyle="#d8f8ff";x.lineWidth=4;x.strokeRect(12,12,876,576);x.beginPath();x.moveTo(450,12);x.lineTo(450,588);x.stroke();x.beginPath();x.arc(450,300,75,0,Math.PI*2);x.stroke();x.fillStyle="#e7f6ff";x.font="bold 26px system-ui";x.textAlign="center";x.fillText((puck.score1||0)+"  —  "+(puck.score2||0),450,42);for(const p of Object.values(players)){x.fillStyle=p.team===1?"#40d9ff":"#ff547c";x.beginPath();x.arc(p.x,p.y,17,0,Math.PI*2);x.fill();x.fillStyle="white";x.font="13px system-ui";x.fillText(p.name,p.x,p.y-23)}x.fillStyle="#101820";x.beginPath();x.arc(puck.x,puck.y,9,0,Math.PI*2);x.fill()}
function sendMove(){if(!room)return;const x=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),y=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);if(x||y)dir={x,y};room.send("move",{x,y});}
window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();keys[e.key]=true;sendMove();if(e.key===" "&&room)room.send("shoot",dir)});window.addEventListener("keyup",e=>{keys[e.key]=false;sendMove()});
draw();
const moveKeys={up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"};
document.querySelectorAll("[data-move]").forEach(btn=>{const press=e=>{e.preventDefault();keys[moveKeys[btn.dataset.move]]=true;sendMove()};const release=e=>{e.preventDefault();keys[moveKeys[btn.dataset.move]]=false;sendMove()};btn.addEventListener("pointerdown",press);btn.addEventListener("pointerup",release);btn.addEventListener("pointercancel",release);btn.addEventListener("pointerleave",release)});
$("shoot").onclick=()=>{if(room)room.send("shoot",dir)};
</script></body></html>

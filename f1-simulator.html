<title>F1 Simulator</title>
<meta name="description" content="Play the 3D F1 simulator from the Home game library.">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d14;color:#e9f0f6;font:14px system-ui,sans-serif}
body{display:grid;place-items:center}

<body>
<p>Opening F1 Simulator… <a href="/F1/">Continue to the simulator</a></p>
<script>
  // Load the F1 Pages project directly. Both /doc/ and /F1/ share this origin,
  // allowing the Home account bridge to attach to the game itself.
  const target = new URL("/F1/", window.location.origin);
  target.search = window.location.search;
  target.hash = window.location.hash;
  window.location.replace(target.href);
</script>
<noscript><a href="/F1/">Open F1 Simulator</a></noscript>

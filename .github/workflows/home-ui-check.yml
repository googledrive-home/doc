name: Home UI validation

on:
  pull_request:
    branches: [main]
    paths:
      - "arcade-portal.js"
      - "arcade-portal.css"
      - "f1-simulator.html"
      - "home-game-bridge.js"
      - "hockey-server/src/index.js"
      - ".github/workflows/home-ui-check.yml"
  push:
    branches: [main]
    paths:
      - "arcade-portal.js"
      - "arcade-portal.css"
      - "f1-simulator.html"
      - "home-game-bridge.js"
      - "hockey-server/src/index.js"
      - ".github/workflows/home-ui-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Home
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check portal JavaScript syntax
        run: node --check arcade-portal.js
      - name: Check backend JavaScript syntax
        run: node --check hockey-server/src/index.js
      - name: Check cloud-save bridge syntax
        run: node --check home-game-bridge.js
      - name: Check F1 wrapper script syntax
        run: |
          node --input-type=commonjs -e "
            const fs = require('node:fs');
            const html = fs.readFileSync('f1-simulator.html', 'utf8');
            const match = html.match(/<script>([\\s\\S]*?)<\\/script>/);
            if (!match) throw new Error('F1 wrapper script not found');
            new Function(match[1]);
          "

  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check published Home portal
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error "https://googledrive-home.github.io/doc/arcade-portal.js" -o /tmp/home-portal-live.js &&
               grep -q "function renderDashboard" /tmp/home-portal-live.js &&
               grep -q "portalLeaderboardsView" /tmp/home-portal-live.js; then
              node --check /tmp/home-portal-live.js
              echo "Home Pages is serving the dashboard and leaderboard UI."
              exit 0
            fi
            echo "Waiting for the expected Home Pages build (attempt $attempt/18)."
            sleep 10
          done
          echo "The published Home portal did not contain the expected features."
          exit 1

      - name: Check Render database health
        shell: bash
        run: |
          set -euo pipefail
          url="https://hockey-multiplayer.onrender.com/health/storage"
          for attempt in $(seq 1 18); do
            code="$(curl --silent --show-error --output /tmp/render-storage-health.json --write-out '%{http_code}' "$url" || true)"
            if [[ "$code" == "200" ]] && grep -q '"database":"connected"' /tmp/render-storage-health.json; then
              echo "Render database health is connected."
              exit 0
            fi
            echo "Waiting for Render storage health (attempt $attempt/18, HTTP $code)."
            sleep 10
          done
          echo "Render storage health did not return a connected database."
          exit 1

      - name: Check live leaderboard API response
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            "https://hockey-multiplayer.onrender.com/portal/games/f1-simulator/leaderboard" \
            -o /tmp/home-leaderboard.json
          node --input-type=commonjs -e "
            const fs = require('node:fs');
            const data = JSON.parse(fs.readFileSync('/tmp/home-leaderboard.json', 'utf8'));
            if (data.gameId !== 'f1-simulator' || data.verified !== false || !Array.isArray(data.entries)) {
              throw new Error('Unexpected live leaderboard response shape');
            }
            console.log('The live leaderboard returns the expected unverified response.');
          "

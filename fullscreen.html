<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fullscreen Game</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui}#bar{position:fixed;z-index:2;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:center;background:#07101add;border:1px solid #ffffff22;border-radius:12px;padding:9px}button{color:#fff;background:#172537;border:1px solid #3a5068;border-radius:9px;padding:9px 13px;font-weight:800;cursor:pointer}#url{font-size:12px;color:#9eafc4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}iframe{width:100%;height:100%;border:0;display:block}#hint{position:fixed;inset:0;display:grid;place-items:center;z-index:1;pointer-events:none}.box{background:#07101ddd;border:1px solid #ffffff22;border-radius:14px;padding:18px 22px;text-align:center;max-width:420px}.box p{color:#b8c7d8;font-size:13px}</style></head><body><div id="bar"><button onclick="enterFS()">Enter Fullscreen</button><button onclick="exitFS()">Exit Fullscreen</button><span id="url"></span></div><div id="hint"><div class="box"><strong>Game launcher</strong><p>Click “Enter Fullscreen” once. Browsers require a user gesture before a website can enter true fullscreen.</p></div></div><iframe id="game" allow="fullscreen; autoplay" referrerpolicy="no-referrer"></iframe><script>const q=new URLSearchParams(location.search),u=q.get('url');if(!u){document.body.innerHTML='<div style="padding:30px">No game URL supplied.</div>'}else{document.getElementById('game').src=u;document.getElementById('url').textContent=u}async function enterFS(){const f=document.getElementById('game');try{if(f.requestFullscreen)await f.requestFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();document.getElementById('hint').style.display='none';document.getElementById('bar').style.opacity='.25'}catch(e){alert('Fullscreen was blocked by the browser. Try the browser fullscreen control instead.')}}function exitFS(){document.exitFullscreen?.();document.getElementById('hint').style.display='grid';document.getElementById('bar').style.opacity='1'}</script></body></html>
